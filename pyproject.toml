[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmb2glb"
version = "0.1.0"
description = "Experimental South Park TFBW 2D MMB to GLB converter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
textures = ["Pillow>=10.0"]

[project.scripts]
mmb2glb = "mmb2glb.cli:main"

[tool.setuptools.packages.find]
include = ["mmb2glb*"]
